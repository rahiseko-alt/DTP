  adult students or staff, with natural Japanese facial appearance. This is an intentional
  visual casting request, not identification of existing people''s ethnicity. Keep
  the same genders, age ranges, body sizes, outfits, masks and eyeglasses. All men
  completely clean-shaven: no moustache, beard, stubble or dark facial-hair shadows.
  Everyday hair and clothing, natural realistic skin tones and normal skin texture
  with small imperfections. No fashion-model casting, airbrushed skin, whitening,
  cosmetic retouch, excessive makeup or beauty filter. Keep each cell''s exact original
  number of people, including partially visible and out-of-focus background people.
  Change faces and associated skin/hair only as needed for the new fictional casting.
  Maintain original photographic lighting and realism. Do not add people, captions,
  decorations, graphical elements or text. Negative: text, letters, typography, words,
  numbers, logo, watermark, signature, QR code, caption. Six cells, two rows of three.
  Each cell has exactly one foreground person. The blank pale gray circular disks
  at the right of every cell are protected graphic placeholders; keep exactly their
  position, shape, size and flat pale gray fill, no markings. They will be restored
  by code. Preserve laptop positions. Bottom-center woman is holding a microphone,
  preserve it.'
