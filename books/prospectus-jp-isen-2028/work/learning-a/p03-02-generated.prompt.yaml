prompt: 'Edit this fixed photographic contact sheet in place. These are already fictional
  AI-generated illustrative people, not identified real people. Replace EVERY person
  with a new fictional ordinary Japanese person appropriate for a Japanese college
  brochure, including background people. All men must be completely clean-shaven with
  no beard, no moustache, no stubble. Natural skin texture, realistic ordinary faces
  and ordinary casual clothing, no fashion-model retouching or porcelain skin. Preserve
  exactly the same photography composition, poses, gaze direction, hand gestures,
  camera, framing, objects, interior/park backgrounds and number of people PER CELL.
  Do not add, omit or swap cells. Remove the rough preparatory rectangle masks by
  reconstructing continuous realistic background/screen/clothing. Screens must show
  only soft abstract nonverbal interface shapes without text. All clothing and equipment
  unbranded without words. NO text, letters, typography, words, numbers, logo, watermark,
  signature, QR code, caption. CRITICAL output same atlas geometry as input, full
  canvas, solid BLACK 12-pixel outer gutters and 24-pixel horizontal separators preserved
  exactly; no new separators. Each photo occupies x12..1012 and height488, each row
  step512. Canvas 1024x1536, THREE equally sized rows. Row1: computer classroom, exactly
  3 men, foreground right back-of-head, central white T-shirt man pointing left toward
  monitor, background man seated. Row2: table group of 4 foreground students (man
  white T-shirt left; woman dark shirt center-left; woman light shirt center-right;
  ponytail woman white blouse right) plus the 3 background seated students as pictured;
  all must look Japanese, same positions. Row3: ONE Japanese woman in beige blazer,
  microphone held close at center-left and open hand raised to right, presentation
  screen behind. Keep all 3 photos in their own rows exactly.'
negative_prompt: text, letters, typography, words, numbers, logo, watermark, signature,
  QR code, caption
