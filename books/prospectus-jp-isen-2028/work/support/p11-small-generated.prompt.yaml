prompt: 'Edit only people in the supplied reference photographs. These are fictional
  recruitment illustration photos, not documentary evidence. Create natural, realistic
  Japanese brochure casting (Japanese-image East Asian appearance as an art direction,
  do not claim to identify anyone''s nationality). Every visible man must be completely
  clean-shaven, no moustache or stubble. Replace any head-wrapped cloth/headscarf
  and ethnic outfits with everyday casual clothing and natural uncovered black or
  dark brown hair. Keep the same people count, age ranges, genders, positions, gaze,
  expressions, conversation, hand actions, camera angle, crop, lighting and indoor
  background. Each face must be a new fictional identity, not an exact copy of any
  real individual. Photographic realism, natural skin and hands. No text, letters,
  typography, words, numbers, logo, watermark, signature, QR code, caption. Fixed
  contact sheet of EIGHT independent photos: 3 across top row, 3 across middle row,
  2 across bottom row centered. Retain exact tile boundaries, gray gutters, existing
  pastel tile backgrounds, poses and count in each tile. Top left worried woman and
  bottom left group woman must have natural uncovered dark hair, no scarf. All men
  clean shaven. Preserve realistic worried/chin-on-hand expressions in first four
  tiles and happy consultation expressions in last four. Keep question-mark/scribble/coin
  graphics in their exact original positions. No new graphics or text.'
negative_prompt: text, letters, typography, words, numbers, logo, watermark, signature,
  QR code, caption
