  clean-shaven, no moustache or stubble. Replace any head-wrapped cloth/headscarf
  and ethnic outfits with everyday casual clothing and natural uncovered black or
  dark brown hair. Keep the same people count, age ranges, genders, positions, gaze,
  expressions, conversation, hand actions, camera angle, crop, lighting and indoor
  background. Each face must be a new fictional identity, not an exact copy of any
  real individual. Photographic realism, natural skin and hands. No text, letters,
  typography, words, numbers, logo, watermark, signature, QR code, caption. This is
  an ordinary candid classroom with many students seated at tables and teacher standing
  in the middle. Preserve precisely the room, all tables/chairs, windows/blinds, wall,
  camera framing, everyone count and their exact locations, the writing/studying actions,
  the peace-sign pose by the front-center-right woman, natural everyday clothes. Change
  all visible people's identities to Japanese-image casting and clean-shave the men.
  Do not add headscarves. Keep candid imperfect lighting and a real classroom photo
  feel, not an advertising studio. Do not invent any text on objects.
