{{!-- page_010 記入例②（左ページ）。様式3の記入済み見本と説明 --}}
<div class="p15-bg" aria-hidden="true"></div>
<header class="p15-head">
  <h1>記入例②　誓約書・保証書【様式3】</h1>
  <p>氏名・住所・電話番号などはすべて架空の見本です。</p>
</header>
<div class="p15-ex p15-ex--c3"><span class="p15-tag">様式3　誓約書・保証書</span>
  <div class="p15-zoom"><div class="fm">{{> book/form-seiyaku sample=true}}</div></div>
</div>
<i class="p15-pin" style="top:97mm">F</i><i class="p15-pin" style="top:163mm">G</i>
<ol class="p15-cards p15-cards--c3">
  <li><b>F</b>受験者本人の氏名は、本人が直筆で記入します。住所・電話番号も記入します。</li>
  <li><b>G</b>保証人の氏名は直筆で記入し、本人との続柄を書きます。保証人は、経済的に独立した25歳以上の者です。</li>
</ol>
<footer class="page-folio" data-side="{{page.side}}">
  <span class="page-folio__number num">{{page.number}}</span>
  <span class="page-folio__school">{{facts.school.name}}</span>
</footer>
