size: 1700x925
prompt: |
  Correct this asset by cropping it to ONLY the upper classroom photograph. Remove the entire blue rectangular band and the entire white lower area from the canvas, not replace them. Output one wide landscape photograph, approximately 1055:574 aspect ratio, bounded exactly by the original top, left, right edges and the horizontal photograph/blue-band boundary. Keep the existing photograph, four foreground people, background classroom, laptop, faces, clothing, expressions and framing unchanged as closely as possible. No extrapolation, no new scene, no blue graphic panels, no white margins, no page layout. No text, letters, numbers, logos, QR, captions, watermarks. This is a photo-only reusable part.
negative_prompt: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption
