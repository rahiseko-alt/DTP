prompt: |
  Edit target: the supplied GPT-created brochure spread. Extract ONLY ONE photo: right page lower strip, second of four photos from left: rear view of student working at a large desktop monitor. Output a standalone rectangular landscape photograph with the same framing, people, pose, clothing, lighting and background as that specific small photo. It must fill the entire canvas, no page or border. Remove every overlaid app logo, badge, white logo circle and all writing and numeric step labels; naturally reconstruct the obscured portion of the photo. Remove all text on displays and replace display content with simple nonverbal visual thumbnails/abstract blocks with no text, letters, numbers or recognizable software logos. Do not include neighboring photos. No text, typography, captions, watermark, signature, QR, logos, icons, panels, bands, cards, white margins. Keep any laptop or microphone that is physically part of the photograph. No added people or added futuristic effects. Preserve the source photograph's visual content as closely as possible rather than redesigning it. Photo-only reusable asset.
negative_prompt: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption
