visual_checks:
- 全3枚を画像で目視。各画像は男性2人・女性2人の4人。
- 髪型・顔の特徴・上着の組合せを3シーンで目視照合。同じ4人としておおむね連続。
- 教室の相談・PC作業・廊下の会話で構図と動作が変わる。
- 全員がカメラを見て並ぶポーズを避け、作業・会話中の表情。
- 目立つ文字・ロゴ・透かしなし。目立つ手足の破綻なし。
limitations:
- 生成による微細な顔の差や肌の均一感は残り得る。
- 架空の人物・校内であり、実在の在校生や実際の学校写真ではない。
- 1536x1024px。300dpiで約130x87mm、200dpiで約195x130mmまで。A4全面用の最終高解像度素材ではない。
- 紙面未反映、最終印刷未確認。
