page_heading: Google認定資格を持つ講師から、AIを実践的に学ぶ。
evidence:
- 生成画像を開いて確認
- 旧写真・PDF8ページ全体を開いて確認
findings:
- 講師の視線が下がり上瞼と口元の動きが弱く、説明中の反応が写っていない。本人の顔立ちではなく演出の問題。
- 学生全員がPCを見ていて講師との応答がない。
- 中央の紺服の男子学生が面積とコントラストで目立ち、講師の主役性が弱い。
- 紙面写真枠約1.87:1に対して素材3:2。左上コピーと講師頭部の重なりにも懸念。
- 1536px幅は210mmで約186dpi。最終印刷用には不足。
next_direction:
- 講師を中央寄りの主役にして着席の別構図を構成。添付男性の顔・首・体・手を一体で生成。
- 講師が学生一人へ目を向け、説明中の口元と目元に自然な反応。
- 学生一人が講師へ頷き、一人は操作、一人は画面の内容に反応。
- 横長1.87:1の写真枠と左上コピー領域を想定。顔と指導する手を安全範囲へ。
- 方向決定後に幅2550px以上の印刷素材を確保し、実紙面へ合成確認。
parent_decision: 独立評価と親の紙面照合により差戻し。生成・紙面差替はこの評価では行っていない。
