prompt: 'Generate a completely NEW photographic scene. IMPORTANT REFERENCE SELECTION:
  among the supplied conversation images, use ONLY the USER-UPLOADED VERTICAL PORTRAIT
  showing a SINGLE middle-aged man in a white button-down shirt, photographed from
  the chest upward, short upward brushed black hair, NO glasses, a beige office wall
  and a large black screen behind him. That is the identity reference. Other supplied
  images depicting classrooms, groups or brochure pages are NOT references: ignore
  them entirely, do not reuse their faces, body shapes, clothes, scene arrangement,
  camera angle or lighting. Do not imitate or modify an earlier classroom image. If
  you can see the single-man portrait, faithfully use THAT man''s face and age, not
  a generic teacher.


  Create a new panoramic school brochure HERO photograph, approximately 1.87:1, designed
  for a page on learning practical AI from qualified instructors. Teacher is the main
  protagonist, seated center-left, face large, clearly visible in three-quarter view.
  Match the uploaded single man''s actual facial identity: short black upward brushed
  hair, his actual hairline and forehead, ears, eyes, nose and jaw, lightly tanned
  textured skin, clean shaven, no eyeglasses. Plain white button-down shirt, ordinary
  average build. Newly construct his entire head-neck-shoulder-torso-arms-hands as
  a natural seated person; not a pasted face on a pre-existing pose. He sits upright
  at a pale wood rounded-corner table, turned slightly to a student at right. Both
  feet are grounded, shoulders relaxed, one forearm naturally rests on tabletop, the
  other hand makes a small open-palm explanatory gesture near his chest, not a long
  diagonally extended pointing arm.


  EXPRESSION AND INTERACTION ARE ESSENTIAL: he looks directly into the eyes of a female
  student, engaged attentive eyes with subtle natural window catchlights, slight raising
  of brows, cheeks participating in a small warm smile, lips slightly apart MID-SENTENCE.
  He looks alive and intellectually engaged in explaining something to a person. Do
  not give him downcast blank eyes, a fixed neutral stare, a forced big grin or a
  camera-facing pose. The young woman at right makes eye contact back with an understanding
  small smile, as if she has just grasped his explanation. Exactly three adult students
  aged 19-22: that responding woman in muted sage at right; a male student in light
  beige at far-left side, visually secondary, operating a laptop; and a second woman
  in pale gray-beige a little farther right observing the exchange with interested
  expression and a pen above a plain notebook. Students naturally East Asian/mixed-heritage
  visual casting with varied medium and gently tan complexions. Do not make all faces
  identical, pale or glamour-model perfect. No one looks at camera. Different actions
  and eye lines: teacher speaking, one student responding, one operating, one observing.


  COMPOSITION completely newly arranged: photographed diagonally across the table
  at seated eye height, not a flat row and not teacher standing behind students. Keep
  teacher''s face prominent near center-left and responding student''s face to right,
  with visible space between their profiles and no overlapping heads. Low unbranded
  laptop toward lower-left foreground, small enough not to dominate or hide hands.
  Limit empty tabletop. Calm low-detail pale background at UPPER LEFT for future text
  overlay; no face or hand in that corner. Softly blurred modest real Japanese computer
  classroom, ordinary dark monitors at rear, natural side window light and realistic
  unified shadows. All four faces and teaching hand should survive a central 1.87:1
  crop. Photorealistic editorial school photography, authentic skin and body proportions,
  natural hair, correct hands, subtle candid expressions. Never re-use the older classroom
  or brochure layouts.


  Output a single clean photograph only. No rendered text, letters, typography, words,
  numbers, logo, watermark, signature, QR code, caption or certification badges. No
  collage. Do not paste or retain any pixels from any prior generated classroom photo.'
