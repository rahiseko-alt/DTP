prompt: '日本の専門学校で、男性講師と成人の学生3人がパソコンを囲んで学ぶ、自然な写真を新規生成する。横長3:2。


  今回添付された男性ポートレート1枚だけを、講師の容姿の参照に使う。顔立ち、年齢感、短い黒髪、肌の質感、耳や額の形を尊重し、眼鏡なし、白いシャツ。美化や若返りはしない。顔だけを別の体に合わせず、この男性の首・肩・胴体・腕・手を、姿勢に合った一人の人体として新しく構成する。ポートレートの背景・自撮りの姿勢は引き継がない。


  カメラは机の斜め横、座っている人の目線の高さ。少し引いた画角で、4人の上半身と机上の手元を写す。講師は画面左側の椅子にしっかり座り、学生と同じ高さで話す。男子学生1人と女子学生2人は、机の向こう側から右側に自然に分かれて座る。全員を横一列に並べない。講師が学生の背後に立つ構図、立って前かがみになる姿勢、上方から学生を覆う配置は使わない。


  ノートパソコンは机の中央。講師は体を学生側へ軽く向け、片手を机に置き、もう片方の手で画面を示しながら説明する。肩や肘を無理に伸ばさず、重心、背骨、首、腕のつながりが自然な座り姿勢。学生は画面や講師へ視線を向け、一人は操作し、一人は話を聞き、一人はノートを取る。全員が同じ表情や動作にならない。全員の顔が自然に見える位置関係。


  学生は18〜22歳程度。少し褐色の肌を含む多様な肌色と自然な東アジア系・日系のイメージの顔立ち。普段着で、髪や肌に自然な細部がある。大げさな笑顔、カメラ目線、広告モデルのようなポーズは避け、授業中の一瞬を撮った雰囲気にする。


  背景は明るく落ち着いた普通のパソコン教室。窓からの柔らかな光が、全員の顔・体・机に同じ方向から当たる。現実的な遠近感と影。過度な美肌加工や人工的な光沢は付けない。机の上の画面やノートには読める文字を描かず、無地または抽象的な図形にする。


  参照画像は今回添付男性のポートレートのみ。過去の授業画像・生成画像は一切使用しない。人物、姿勢、教室、撮影位置を新しく組み立てる。顔の合成画像のようにせず、全員と室内を一つの写真として自然に描く。


  文字、数字、ロゴ、透かし、QRコード、説明文、コラージュは入れない。No text, letters, typography, words, numbers,
