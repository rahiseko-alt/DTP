# 問い合わせ先・SNS（正本）
# - BOOK からは {{#each facts.contacts.contacts}} ... {{label}} {{tel}} ... {{/each}} のように参照する
# - 代表の住所・電話番号は facts/school.yaml。ここには窓口別の連絡先を書く
# - URL を QR コードにする場合は {{qr url}} ／ {{> qr-block url=...}} を使う（URL を画像に焼き込まない）
# 書き方: company-data/README.md ／ ルール: system/rules/company-data.md

contacts:
  # 出典（2026-10-08 記入）: 募集要項 V4「お問い合わせ先」（窓口名は募集要項では「事務局」、願書・AO エントリーシートの送付先では「入学事務局」）
  - id: admissions-office
    label: 入学事務局
    tel: 052-451-3821
    email: ai-nyushi@jp-academy.net

  # 出典: 2026-10-22 ユーザー指定。OC黄色帯チラシの印字メールと保存済みQRを統一。
  # 入学事務局の代表メールは変更しない。
  - id: oc-flyer-email
    label: OCチラシお問い合わせ
    email: aibusiness.kaihougakuen@gmail.com
    note: OC黄色帯チラシ専用。保存済みmailto QRの宛先。

# 公式 SNS（運用中のアカウントのみ。現在は運用前のため空）
sns: []

# 予定している SNS・ホームページ（運用開始前。人間の指示 2026-10-11 で「予定扱い」）
