version: 1
date: 2026-10-15
root: C:/Users/user/Documents/ChatGPT/DTP
mode: parts-only
handoff_ready_means: 入力・成果・編集範囲・確認方法が固定され、設計再判断なしで最初の1件を実装できる
current_components: [icon, info-card, flow, data-table, speech]
shared_api: shared/components/brochure-kit/README.md
verify_command: npx tsx shared/components/brochure-kit/verify.ts
common_forbidden_paths: [company-data, system, books, .codex, .claude, references/user-gpt/isen-draft/page_020.png, references/user-gpt/isen-draft/page_021.png, references/user-gpt/isen-draft/page_022.png, references/user-gpt/isen-draft/page_023.png, references/user-gpt/isen-draft/page_024.png, references/user-gpt/isen-draft/page_025.png]
jobs:
  - id: L01
    title: チェックリスト部品1種を固定仕様で追加
    status: ready_after_parent_handoff_check
    owner: lower-cost-worker
    allowed_files:
      - shared/components/brochure-kit/checklist.hbs
      - shared/layouts/brochure-kit.css
      - shared/components/brochure-kit/verify.ts
      - shared/components/brochure-kit/README.md
    input:
      required: 'items: [{label: string}]'
      optional: 'title: string; 各itemのdetail: string'
      fixed_copy: なし。呼出元から受ける。学校制度の例を作らない
      html: 'ul.bk-checklist > li > span.bk-checklist__mark[aria-hidden=true] + div > strong + 任意p。任意titleはリスト前h3'
      icon: 'markは文字なしCSSのチェック形。既存のロゴ/画像を使わない'
      default_layout: 'ul.bk-checklistをdisplay:flex/flex-direction:column/row-gap:2.5mm/margin:0/padding:0/list-style:noneとする。liはdisplay:flex/flex-direction:row/align-items:flex-start/gap:2.5mm/padding:3mm。各行の文字箱はmin-width:0/flex:1。ul全体をbreak-inside:avoid'
      typography: '任意h3は12pt/1.4/weight800/margin:0 0 2.5mm。strongは9.5pt/1.6/weight700。detail pは8.5pt/1.6/margin:1mm 0 0。文字箱はoverflow-wrap:anywhere'
      mark: 'span.bk-checklist__markはposition:relative/flex:0 0 4mm/width:4mm/height:4mm/margin-top:.6mm/background:var(--color-primary)。::afterはcontent空文字/position:absolute/left:1mm/top:1.1mm/width:2mm/height:1mm/border-left:.35mm solid var(--color-background)/border-bottom同値/transform:rotate(-45deg)。画像・文字グリフは使わない'
      hal: '.bk-kit[data-theme="hal"] .bk-checklist>liにborder-left:1mm solid var(--color-primary)、border-radius:0、background:var(--color-background)。markはborder-radius:0。ulに太線を付けない'
      isen: '.bk-kit[data-theme="isen"] .bk-checklist>liにborder-left:0、background:var(--color-surface)、border-radius:3mm。markはborder-radius:50%。paddingは共通3mm。ulに太線を付けない'
      restrictions: '新部品のセレクターだけ追加。既存5部品の見た目・API・photos/factsは変更しない'
    acceptance:
      - '任意title/detailなしのケースが厳格モードで描画できる'
      - 'title/detailあり・2項目・6項目・長いlabelの4ケースをHAL/医専で確認する'
      - '確認用labelは「確認項目」、長いlabelは「入学前に確認する内容が複数行になった場合の見出し表示を確かめます」。detailは「部品確認用の説明文です」。学校の制度や実績を記入しない'
      - 'label/detailはHTMLエスケープされる。scriptやtriple-bracesを使わない'
      - 'verify既存26ケースを維持し、新ケースを追加する'
      - '画像を開き、文字欠け/隠れ/横はみ出し/画像未読込がないことを報告する'
      - 'npm run typecheck、npm run validate、git diff --checkの結果を返す'
      - '変更ファイル一覧・verify生成の.cache/parts-kit-20261015/compile-check.jsonとpreview.html・コマンド結果・実見画像パス・未確認事項を親へ返す。統合verification.jsonは親が作る'
    escalate_if: '新しい事実/写真/色/全体レイアウト/共通エンジン変更が必要、または指定構造が成立しない'
  - id: L02
    title: 指定された写真ID・寸法の一覧を更新
    status: needs_parent_selected_ids
    allowed_files: [shared/components/brochure-kit/photo-metrics.json]
    input: '親が確定したphoto id配列のみ。photos.yamlは読取専用'
    output: 'id、実ファイル存在、sha256、px、想定枠mm、cover/contain実効dpi。画像は変更しない'
    acceptance: ['式を記載する', '原画像のSHAを変更しない', '不足IDを別IDで補わずエラーで返す']
  - id: H01
    title: 代表配置とテイストを判断
    status: upper-model-only
    reason: '写真の意味、情報階層、参照密度、トリム、HAL/医専の構成判断は機械的な実装ではない'
  - id: H02
    title: 未実装パーツのAPIと採否を決める
    status: upper-model-only
    candidates: [editorial-hero, payment-timeline, support-diagram, document-list, contact-panel, access-panel, testimonial]
    reason: '支払timelineと手順flowを混同しない。施設/取材/制度の不足を先に確認。低モデルへ未定義のまま渡さない'
  - id: H03
    title: 任意2ページの実冊子への組込み
    status: upper-model-only
    requirements: ['見開き全体ON/OFF', '親が対象BOOKと位置を指定', '採番/対向面/製本を確認', '日本人の友人獲得を約束しない']
    reason: '今回の部品作業にBOOK順の機能追加は含めない'
handoff_gate:
  - 作業票L01が許可ファイル内で完結する
  - 既存5部品の厳格モードと表示確認が完了する
  - 原画6面の需要と実写真候補/不足が記録されている
  - 独立確認で未定義の設計判断がL01に残っていない
  - 親がcommit/pushし、現ブランチと再開位置を記録する
