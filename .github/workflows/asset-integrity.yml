name: File identity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  asset-integrity:
    name: asset-integrity
    runs-on: ubuntu-latest
    env:
      STUDIO_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch managed document payloads
        run: |
          git lfs install --local
          # Freshness fingerprints include brand and shared generated assets too.
          # Hydrate every source payload before hashing; pointers are not inputs.
          git lfs pull --include='books/**,output/pdf/**,references/school-own/**,company-data/**,shared/**'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: npm run typecheck
      - run: npx vitest run system/scripts/test/assets.test.ts system/scripts/test/asset-build.test.ts system/scripts/test/baseline-sync.test.ts
      - run: npm run asset:check
      - name: Preserve test result
        if: always()
        run: git rev-parse HEAD
