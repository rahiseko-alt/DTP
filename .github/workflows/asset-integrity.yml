name: File identity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  asset-integrity:
    name: asset-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch managed pilot payloads only
        run: |
          git lfs install --local
          git lfs pull --include='books/oc-approved-20261017/**,references/school-own/oc-approved-20261017/**,company-data/photos/student-*.jpg'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run typecheck
      - run: npx vitest run system/scripts/test/assets.test.ts
      - run: npm run asset:check
      - name: Preserve test result
        if: always()
        run: git rev-parse HEAD
